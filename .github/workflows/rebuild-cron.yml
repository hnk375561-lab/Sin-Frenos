name: Rebuild Cron (SEO freshness)

on:
  schedule:
    # Todos los días a las 12:00 UTC (09:00 hora Argentina)
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  actions: write

jobs:
  trigger-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar 'Deploy to GitHub Pages'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy-pages.yml/dispatches" \
            -d '{"ref":"main"}')

          echo "HTTP status: $HTTP_STATUS"
          cat /tmp/response.json

          if [ "$HTTP_STATUS" -ne 204 ]; then
            echo "ERROR: no se pudo disparar el rebuild (status $HTTP_STATUS)"
            exit 1
          fi
          echo "OK: rebuild disparado correctamente."
